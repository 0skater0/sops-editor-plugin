name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# Note: the JetBrains Plugin Verifier is intentionally NOT run in CI. It downloads
# the full IDE distribution for every target version (~1 GB per IDE, 9 targets),
# which exceeds the free disk space on GitHub-hosted ubuntu-latest runners. Run it
# locally before cutting a release:
#
#   ./gradlew verifyPlugin
#
# The compatibility matrix is declared in build.gradle.kts under pluginVerification.ides.

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Run unit tests
        run: ./gradlew test

      - name: Upload plugin artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sops-editor-plugin
          path: build/distributions/*.zip
          if-no-files-found: error
