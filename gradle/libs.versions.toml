[versions]
kotlin = "2.4.21"
intellijPlatform = "2.20.1"
# Build-classpath overrides for transitive deps of the IntelliJ Platform Gradle Plugin
# that are still pinned to vulnerable versions. Drop once the plugin ships them itself.
jackson = "2.23.0"
jsoup = "1.24.1"

[libraries]
jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
intelliJPlatform = { id = "org.jetbrains.intellij.platform", version.ref = "intellijPlatform" }
